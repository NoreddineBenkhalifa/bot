name: check

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q curl_cffi
      - run: python bot.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FILM_MATCH: ${{ secrets.FILM_MATCH }}
          SITE_IDS: ${{ secrets.SITE_IDS }}
          ATTR_IDS: ${{ secrets.ATTR_IDS }}
          EXCLUDE_IDS: ${{ secrets.EXCLUDE_IDS }}
      - name: save
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * 1" ]; then date -u > heartbeat.txt; git add heartbeat.txt; fi
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update" && git push)
